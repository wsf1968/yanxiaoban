<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>言小办 · 商用独立验证</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><header><strong>言小办<span>商用独立验证</span></strong><p>说清问题，让资料有出处。</p></header><p id="connection" role="status">正在检查配置…</p><form id="request"><label>这次要做什么<select id="mode"><option value="search">查资料</option><option value="travel">做旅游攻略</option><option value="train">查高铁 / 动车</option></select></label><div id="search-fields"><label>你的问题<textarea id="query" maxlength="75" placeholder="例如：上海这周末有哪些展览？"></textarea></label></div><div id="travel-fields" hidden><label>目的地<input id="destination" maxlength="24" placeholder="例如：杭州"></label><div class="row"><label>天数<input id="days" type="number" min="1" max="7" value="3"></label><label>出行日期（可选）<input id="date" type="date"></label></div><p class="hint">默认首次游览、一般步行能力、常规预算；有特殊需求时，当前建议需自行调整。</p></div><div id="train-fields" hidden><div class="row"><label>出发站<input id="departure-station" maxlength="24" placeholder="例如：北京南"></label><label>到达站<input id="arrival-station" maxlength="24" placeholder="例如：上海虹桥"></label></div><div class="row"><label>出发日期<input id="train-date" type="date"></label><label>车次类型<select id="train-filter"><option value="G">高铁 / 城际</option><option value="D">动车</option><option value="GD">高铁及动车</option></select></label></div><p class="hint">填写具体车站名称；北京时间今天起15天内。仅查询，不下单。</p></div><button id="submit">开始整理</button></form><p class="hint">仅使用搜索摘要与来源链接。小红书关闭，正文获取关闭。高铁来自聚合数据817接口；机票和购物尚未开放。</p><section id="conversation" aria-live="polite" aria-label="查询记录"></section><footer>本页为本机验证环境。搜索与攻略问题会发往 DeepSeek，高铁条件会发往聚合数据；key 从本机私有配置读取，不发给浏览器。记录仅保存在本次服务内存中，重启清空。</footer></main></body></html>
